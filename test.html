<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
    <style>
        :root {
            --primary-500: #D9961F;
            --primary-700: #8E5C11;
            --bg-soft: #F9F5F2;
            --surface-elevated: #FFFFFF;
            --border-subtle: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --shadow-md: 0 4px 6px rgba(0,0,0,.07);
            --shadow-xl: 0 20px 25px rgba(0,0,0,.12);
            --font-heading: 'Source Sans 3', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-soft);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(217, 150, 31, 0.03) 100%);
            pointer-events: none;
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 48px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-700), var(--primary-500));
            border-radius: 2px;
        }

        .decorative-line {
            position: absolute;
            top: 50%;
            left: -100px;
            width: 80px;
            height: 1px;
            background: var(--primary-500);
            opacity: 0.3;
        }

        .decorative-line.right {
            left: auto;
            right: -100px;
        }

        .meta {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 3rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }
            
            .decorative-line {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="decorative-line"></span>
        <h1>Hola Mundo</h1>
        <span class="decorative-line right"></span>
        <p class="meta">Según el design system</p>
    </div>
</body>
</html>
